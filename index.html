<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Paraná Configurator V2.2.1</title>
  <style>:root{
  --ink:#0a0a0a;
  --muted:#777;
  --soft:#f5f5f3;
  --line:#dedede;
  --paper:#fff;
  --warn:#fff7e8;
  --danger:#9a2d22;
  --max:1500px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Futura PT","Jost","Century Gothic",Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.35}
.hidden{display:none!important}
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:66px;border-bottom:1px solid var(--ink);display:grid;grid-template-columns:auto auto minmax(180px,1fr) auto auto;align-items:center;gap:18px;padding:0 20px;background:#fff;position:sticky;top:0;z-index:30}
.brand{font-size:19px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.project-actions,.view-actions,.account-actions{display:flex;align-items:center;gap:6px}
.project-title{display:flex;align-items:center;justify-content:center;min-width:0}
.project-title input{width:min(420px,100%);border:0;border-bottom:1px solid transparent;background:transparent;text-align:center;font-size:14px;letter-spacing:.04em;padding:7px 8px}
.project-title input:focus{outline:0;border-color:var(--ink)}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);padding:8px 11px;text-transform:uppercase;letter-spacing:.09em;font-size:10px;line-height:1.2}
.btn:hover:not(:disabled),.btn.active{background:var(--ink);color:#fff}
.btn.subtle{border-color:var(--line);color:#555}
.btn.subtle:hover:not(:disabled){border-color:var(--ink)}
.btn.icon{padding:8px 9px;min-width:34px}
.price-pill{border-left:1px solid var(--line);padding-left:16px;min-width:150px}
.price-pill small{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:9px;color:var(--muted)}
.price-pill strong{display:block;margin-top:2px;font-size:18px;white-space:nowrap}
.configbar{border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:16px;padding:12px 20px;background:#fff;overflow-x:auto;min-height:84px}
.config-group{display:flex;align-items:flex-end;gap:8px;padding-right:16px;border-right:1px solid var(--line)}
.config-group:last-child{border-right:0}
.field{display:grid;gap:4px;min-width:96px}
.field label,.group-label{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{height:34px;border:1px solid var(--line);background:#fff;padding:0 9px;min-width:86px}
.field input:focus,.field select:focus{outline:0;border-color:var(--ink)}
.quick-row,.structure-options,.material-options{display:flex;gap:5px;align-items:center}
.chip{border:1px solid var(--line);background:#fff;padding:8px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;min-height:34px}
.chip:hover,.chip.active{border-color:var(--ink);background:var(--ink);color:#fff}
.structure-chip{width:48px;height:34px;padding:4px;display:grid;place-items:center}
.grid-count{min-width:26px;height:34px;display:inline-grid;place-items:center;border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.structure-icon{display:grid;width:22px;height:18px;border:1px solid currentColor;gap:1px;padding:1px}
.structure-icon i{border:1px solid currentColor;opacity:.75}
.contextbar{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:8px 20px;background:#fafafa;overflow-x:auto}
.context-label{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-right:8px;white-space:nowrap}
.contextbar .btn{background:#fafafa}
.contextbar .btn:hover:not(:disabled),.contextbar .btn.active{background:#000;color:#fff}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);background:#ededeb}
.viewport-wrap{position:relative;min-height:620px;height:calc(100vh - 204px);overflow:hidden}
.viewport{position:absolute;inset:0;background:#ececea;opacity:1;transition:opacity .3s ease}
.viewport.hidden-view{opacity:0;pointer-events:none}
#view2d{display:grid;place-items:stretch;background-color:#efefec;background-image:radial-gradient(rgba(0,0,0,.045) 1px,transparent 1px);background-size:18px 18px}
#view3d{width:100%;height:100%;overflow:hidden;background:#deded9}
#view3d>canvas{display:block;width:100%;height:100%}
.furniture-svg{width:100%;height:100%;display:block}
.hit{cursor:pointer}
.hit:hover>*{filter:brightness(.96)}
.dimension-text{font-size:12px;fill:#777;letter-spacing:.04em}
.view-controls{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;z-index:10;background:rgba(255,255,255,.93);padding:6px;border:1px solid var(--line)}
.view-controls .btn{font-size:9px;padding:7px 9px}
.empty-help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:13px;letter-spacing:.03em;text-align:center;pointer-events:none}
.commercial-summary{border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;background:#fff}.commercial-summary>div:first-child{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.commercial-summary small{text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:9px}.commercial-summary strong{font-size:22px}.commercial-summary span{color:var(--muted);font-size:11px}.commercial-actions{display:flex;gap:7px}
.internal-panel{border-top:1px solid var(--ink);background:#fff;padding:18px 20px 28px;display:grid;gap:18px}
.internal-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:18px}
.internal-card{border:1px solid var(--line);padding:14px;min-width:0}
.internal-card h3{font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin:0 0 10px}
.internal-card p{font-size:12px;color:#555;line-height:1.45;margin:4px 0}
.internal-list{display:grid;gap:6px;font-size:12px}
.internal-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:6px 0}
.internal-actions{display:flex;flex-wrap:wrap;gap:6px}
.entry{min-height:100vh;padding:6vh 24px;display:flex;align-items:center;justify-content:center;background:#fff}
.entry-inner{width:min(1040px,100%)}
.entry-brand{text-align:center;font-size:22px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;margin-bottom:7vh}
.entry-kicker{text-align:center;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);font-size:10px;margin:0 0 12px}
.entry h1{text-align:center;font-size:clamp(28px,4vw,46px);letter-spacing:-.03em;margin:0 0 10px}
.entry-sub{text-align:center;color:var(--muted);margin:0 auto 5vh;max-width:600px;line-height:1.5}
.entry-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.entry-card{border:1px solid var(--ink);background:#fff;text-align:left;padding:30px;min-height:210px;display:flex;flex-direction:column;gap:10px}
.entry-card:hover{background:#000;color:#fff}
.entry-card small{text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.entry-card h2{font-size:23px;margin:0}
.entry-card p{color:var(--muted);line-height:1.5;margin:0}
.entry-card:hover p{color:#ccc}
.entry-card span{margin-top:auto;text-transform:uppercase;letter-spacing:.12em;font-size:11px}
.entry-back{border:0;background:none;padding:0;margin-bottom:30px;text-transform:uppercase;letter-spacing:.11em;font-size:10px;color:var(--muted)}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.catalog-card{border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:9px}
.catalog-card h3{margin:0;font-size:17px}
.catalog-card p{margin:0;color:var(--muted);line-height:1.45;font-size:12px}
.catalog-card .btn{margin-top:auto;align-self:flex-start}
.modal-backdrop{position:fixed;inset:0;background:rgba(255,255,255,.82);display:grid;place-items:center;z-index:100;padding:20px}
.modal{width:min(680px,100%);max-height:80vh;overflow:auto;background:#fff;border:1px solid var(--ink);padding:24px}
.modal h2{margin:0 0 10px;font-size:22px}
.modal p{color:#555;line-height:1.5}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.conflict-list{display:grid;gap:10px;margin-top:14px}
.conflict-item{border:1px solid var(--line);padding:12px}
.conflict-item strong{display:block;font-size:12px}
.conflict-item small{display:block;color:var(--muted);margin-top:5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;background:#000;color:#fff;padding:10px 14px;font-size:12px;z-index:200;transition:.16s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.warning-strip{position:absolute;left:16px;top:16px;z-index:12;max-width:420px;background:#fff;border:1px solid #c9a66c;padding:10px 12px;font-size:11px;line-height:1.4}
@media(max-width:1100px){
  .topbar{grid-template-columns:auto auto minmax(120px,1fr) auto}.account-actions{display:none}.price-pill{min-width:130px}
  .internal-grid{grid-template-columns:repeat(2,minmax(180px,1fr))}
}
@media(max-width:760px){
  .topbar{height:auto;min-height:66px;grid-template-columns:1fr auto;gap:8px;padding:10px 12px}.brand{font-size:15px}.project-title{grid-column:1/-1;order:3}.view-actions{justify-self:end}.project-actions .btn:nth-child(n+4){display:none}.price-pill{display:none}
  .configbar{padding:10px 12px}.config-group{padding-right:10px}.contextbar{padding:8px 12px}.viewport-wrap{height:62vh;min-height:500px}
  .entry{padding:4vh 16px}.entry-cards{grid-template-columns:1fr}.entry-card{min-height:170px;padding:22px}
  .internal-grid{grid-template-columns:1fr}.commercial-summary{align-items:flex-start;flex-direction:column}.view-controls{right:8px;bottom:8px;flex-wrap:wrap;max-width:calc(100% - 16px)}
}

/* ===================================================================
   V2.0.9 · escala de interfaz y controles comerciales dentro del viewport
   =================================================================== */
.topbar{
  height:78px;
  grid-template-columns:auto auto minmax(180px,1fr) auto;
  gap:20px;
  padding:0 24px;
}
.brand{font-size:23px}
.project-actions,.account-actions{gap:8px}
.project-title input{font-size:17px;padding:9px 10px}
.btn{padding:10px 14px;font-size:12px;letter-spacing:.085em}
.btn.icon{padding:10px 11px;min-width:42px}
.configbar{gap:14px;padding:14px 24px;min-height:96px}
.config-group{gap:10px;padding-right:14px}
.field{gap:5px;min-width:102px}
.field label,.group-label{font-size:11px}
.field input,.field select{height:42px;padding:0 10px;min-width:92px;font-size:15px}
.field.measure-field{min-width:84px;width:84px}
.field.measure-field input,.field.measure-field select{width:84px;min-width:84px}
.quick-row,.structure-options,.material-options{gap:7px}
.chip{padding:10px 12px;font-size:12px;min-height:42px}
.grid-count{min-width:32px;height:42px;font-size:16px}
.contextbar{height:66px;gap:9px;padding:10px 24px}
.context-label{font-size:12px;margin-right:10px}
.viewport-wrap{min-height:650px;height:calc(100vh - 240px)}
.dimension-text{font-size:15px}
.view-controls{left:20px;right:auto;bottom:20px;gap:8px;padding:8px}
.view-controls .btn{font-size:11px;padding:9px 12px}
.viewport-dock{
  position:absolute;
  right:20px;
  bottom:20px;
  z-index:14;
  width:330px;
  display:grid;
  gap:8px;
  padding:10px;
  background:rgba(255,255,255,.95);
  border:1px solid var(--ink);
  backdrop-filter:blur(5px);
}
.viewport-tabs{display:grid;grid-template-columns:1fr;gap:6px}
.viewport-tabs .btn{width:100%;font-size:12px;padding:10px 12px}
.viewport-price{display:grid;grid-template-columns:1fr 1.18fr;border-top:1px solid var(--line)}
.price-option{padding:10px 10px 4px 0;min-width:0}
.price-option+.price-option{padding-left:12px;border-left:1px solid var(--line)}
.price-option small{display:block;min-height:28px;font-size:9px;line-height:1.35;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.price-option strong{display:block;margin-top:4px;font-size:20px;letter-spacing:-.035em;white-space:nowrap}
.price-option.discounted strong{font-size:23px}
.price-option.discounted small{color:#333}
.whatsapp-contact{display:block;width:100%;margin-top:10px;text-align:center;text-decoration:none;background:#111;color:#fff;border-color:#111}
.whatsapp-contact:hover{background:#fff!important;color:#111!important}

@media(max-width:1100px){
  .topbar{grid-template-columns:auto auto minmax(120px,1fr) auto}
}
@media(max-width:760px){
  .topbar{height:auto;min-height:76px;grid-template-columns:1fr auto;gap:10px;padding:11px 12px}
  .brand{font-size:18px}
  .project-title{grid-column:1/-1;order:3}
  .project-actions .btn:nth-child(n+4){display:none}
  .configbar{padding:11px 12px;min-height:90px}
  .config-group{padding-right:10px}
  .contextbar{padding:9px 12px;height:62px}
  .viewport-wrap{height:66vh;min-height:520px}
  .viewport-dock{right:8px;bottom:8px;width:min(330px,calc(100% - 16px));padding:8px}
  .price-option strong{font-size:18px}.price-option.discounted strong{font-size:20px}
  .view-controls{left:8px;bottom:132px;max-width:calc(100% - 16px);flex-wrap:wrap}
}


/* ===================================================================
   V2.1.1 · branding, precio y toggle unificado
   =================================================================== */
.topbar{height:72px;grid-template-columns:auto 1fr auto;gap:16px;padding:0 18px;}
.brand{display:flex;align-items:center;height:100%;}
.brand img{display:block;height:32px;width:auto;object-fit:contain;}
.topbar-spacer{min-width:0;}
.account-actions,.project-title{display:none!important;}
.project-actions{justify-self:end;}
.entry-brand{display:flex;justify-content:center;align-items:center;margin-bottom:6vh;}
.entry-brand img{width:min(720px,92vw);height:auto;display:block;}
.field.measure-field{min-width:72px;width:72px;}
.field.measure-field input,.field.measure-field select{width:72px;min-width:72px;}
.field input,.field select{min-width:78px;padding:0 8px;}
.viewport-dock{width:352px;gap:10px;padding:12px;background:rgba(255,255,255,.94);border:1px solid var(--ink);backdrop-filter:none;}
.viewport-toggle{width:100%;font-size:11px;padding:10px 12px;}
.viewport-price{display:grid;grid-template-columns:1fr;border-top:0;background:#f7f7f4;border:1px solid #111;padding:12px 22px 14px;}
.price-separator{height:1px;background:#bdbdb8;margin:10px 0 8px;}
.price-option{padding:0;border:0!important;}
.price-option small{display:block;min-height:auto;font-size:11px;line-height:1.2;letter-spacing:0;text-transform:none;color:#7b7b77;margin-bottom:6px;}
.price-option strong{display:block;letter-spacing:-.04em;white-space:nowrap;font-weight:600;color:#050505;}
.price-option.discounted strong{font-size:60px;line-height:.95;}
.price-option:not(.discounted) strong{font-size:40px;line-height:1;}
.price-option.discounted small{color:#7b7b77;}
@media(max-width:760px){
  .topbar{height:auto;min-height:68px;grid-template-columns:1fr auto;padding:10px 12px;}
  .brand img{height:24px;}
  .viewport-dock{right:8px;bottom:8px;width:min(350px,calc(100% - 16px));padding:8px;}
  .price-option.discounted strong{font-size:46px;}
  .price-option:not(.discounted) strong{font-size:31px;}
}


/* ===================================================================
   V2.1.3 · responsive móvil
   =================================================================== */
@media (max-width: 900px) {
  .app-shell{overflow-x:hidden;}
  .topbar{height:auto;min-height:68px;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;align-items:start;}
  .brand img{height:24px;}
  .project-actions{justify-self:end;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:52vw;}
  .project-actions .btn{padding:9px 10px;font-size:11px;min-height:38px;}
  .warning-strip{left:8px;right:8px;top:8px;max-width:none;}
  .configbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;padding:10px 12px;min-height:auto;overflow:visible;}
  .config-group{border:1px solid var(--line);padding:10px;border-right:0;flex-wrap:wrap;align-items:flex-start;background:#fff;}
  .configbar>.config-group:first-child{grid-column:1/-1;}
  .field{min-width:0;}
  .field input,.field select,.field.measure-field input,.field.measure-field select{width:100%;min-width:0;}
  .field.measure-field{width:auto;min-width:0;}
  .quick-row,.material-options{flex-wrap:wrap;}
  .contextbar{height:auto;min-height:56px;padding:8px 12px;gap:6px;}
  .context-label{margin-right:4px;}
  .workspace{display:block;}
  .viewport-wrap{height:56vh;min-height:420px;}
  .view-controls{left:8px;bottom:126px;padding:6px;gap:6px;max-width:calc(100% - 16px);flex-wrap:wrap;}
  .viewport-dock{right:8px;bottom:8px;width:min(330px,calc(100% - 16px));padding:8px;}
  .commercial-summary{padding:12px;gap:12px;align-items:flex-start;flex-direction:column;}
  .commercial-summary strong{font-size:20px;}
  .commercial-actions{width:100%;flex-wrap:wrap;}
  .internal-panel{padding:14px 12px 18px;}
  .internal-grid{grid-template-columns:1fr;gap:12px;}
}

@media (max-width: 640px) {
  .topbar{padding:8px 10px;}
  .project-actions{max-width:58vw;}
  .project-actions .btn{font-size:10px;padding:8px 9px;min-height:36px;}
  .configbar{grid-template-columns:1fr;gap:8px;padding:8px 10px;}
  .configbar>.config-group{grid-column:auto !important;}
  .configbar>.config-group:first-child{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .configbar>.config-group:nth-child(2){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .config-group{padding:9px;}
  .field label,.group-label{font-size:10px;}
  .field input,.field select{height:40px;font-size:14px;padding:0 8px;}
  .chip{min-height:40px;padding:9px 10px;font-size:11px;}
  .grid-count{height:40px;min-width:30px;font-size:15px;}
  .contextbar{padding:8px 10px;}
  .contextbar .btn{padding:8px 9px;font-size:10px;min-height:36px;}
  .viewport-wrap{height:51vh;min-height:360px;}
  .viewport-dock{width:min(300px,calc(100% - 16px));padding:7px;}
  .viewport-toggle{min-height:38px;font-size:10px;}
  .viewport-price{padding:10px 14px 12px;}
  .price-option small{font-size:10px;}
  .price-option.discounted strong{font-size:38px;}
  .price-option:not(.discounted) strong{font-size:28px;}
  .view-controls{bottom:112px;}
  .view-controls .btn{font-size:10px;padding:8px 9px;min-height:36px;}
  .entry{padding:20px 14px;align-items:flex-start;}
  .entry-inner{width:100%;}
  .entry-brand{margin-bottom:28px;}
  .entry-brand img{width:min(84vw,420px);}
  .entry-kicker{font-size:9px;}
  .entry h1{font-size:clamp(26px,9vw,38px);}
  .entry-sub{margin-bottom:28px;font-size:14px;}
  .entry-card{padding:18px;min-height:148px;}
  .catalog-grid{grid-template-columns:1fr;gap:10px;}
  .catalog-card{padding:14px;}
  .toast{bottom:10px;max-width:calc(100% - 24px);width:max-content;}
}


/* ===================================================================
   V2.1.4 · mobile compact redesign
   =================================================================== */
.mobile-toolbar{display:none;}
.mobile-sheet-backdrop{position:fixed;inset:0;background:rgba(255,255,255,.76);backdrop-filter:blur(2px);z-index:150;display:grid;place-items:center;padding:16px;}
.mobile-sheet-card{width:min(480px,100%);max-height:min(80vh,680px);overflow:auto;background:#fff;border:1px solid var(--ink);padding:14px;display:grid;gap:14px;}
.mobile-sheet-header{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.mobile-sheet-header h3{margin:0;font-size:18px;letter-spacing:.02em;}
.mobile-sheet-grid3,.mobile-sheet-grid2{display:grid;gap:10px;}
.mobile-sheet-grid3{grid-template-columns:repeat(3,minmax(0,1fr));}
.mobile-sheet-grid2{grid-template-columns:repeat(2,minmax(0,1fr));}
.mobile-stepper{display:flex;align-items:center;gap:8px;}
.mobile-stepper .btn{min-width:42px;}
.mobile-materials{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mobile-material{border:1px solid var(--ink);background:#f3f3ef;padding:14px;display:grid;gap:6px;justify-items:center;text-transform:uppercase;}
.mobile-material span{font-size:28px;line-height:1;font-weight:600;letter-spacing:.02em;}
.mobile-material small{font-size:11px;letter-spacing:.08em;}
.mobile-material.active{background:#111;color:#fff;}
.mobile-context-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.mobile-context-grid .btn{min-height:42px;white-space:normal;}
.mobile-empty{margin:0;color:var(--muted);line-height:1.45;font-size:14px;}
.desktop-view-toggle{display:block;width:100%;margin-top:12px;}

@media (max-width: 900px) {
  .app-shell{display:flex;}
  .configbar,.contextbar{display:none !important;}
  .viewport-tabs{display:none;}
  .workspace{order:2;}

    const distance = this.fittedDistance(directionX, directionY, directionZ);
    this.updateTarget();
    this.camera.position.set(distance * directionX, this.targetCenter.y + distance * directionY, this.targetCenter.z + distance * directionZ);
    this.applyCameraLimits(distance);
    this.controls.update();
    this.requestRender();
  }
  resetCamera() {
    this.setIsoView();
  }
  resize() {
    if (!this.renderer || !this.camera) return;
    const rect = this.container.getBoundingClientRect();
    const width = Math.max(1, rect.width);
    const height = Math.max(1, rect.height);
    this.renderer.setSize(width, height, true);
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
    this.requestRender();
  }
  requestRender = () => {
    if (this.renderPending || !this.renderer) return;
    this.renderPending = true;
    this.frame = requestAnimationFrame(this.renderLoop);
  };
  renderLoop = () => {
    this.renderPending = false;
    let keepGoing = false;
    for (const pivot of this.doorPivots) {
      if (typeof pivot.userData.targetRotation === "number") {
        const delta = pivot.userData.targetRotation - pivot.rotation.z;
        if (Math.abs(delta) > 1e-3) {
          pivot.rotation.z += delta * 0.16;
          keepGoing = true;
        } else pivot.rotation.z = pivot.userData.targetRotation;
      }
    }
    for (const group of this.drawerGroups) {
      if (typeof group.userData.targetY === "number") {
        const delta = group.userData.targetY - group.position.y;
        if (Math.abs(delta) > 2e-4) {
          group.position.y += delta * 0.16;
          keepGoing = true;
        } else group.position.y = group.userData.targetY;
      }
    }
    if (this.controls?.update()) keepGoing = true;
    this.renderer.render(this.scene, this.camera);
    if (keepGoing) this.requestRender();
  };
  dispose() {
    cancelAnimationFrame(this.frame);
    this.resizeObserver?.disconnect();
    for (const geometry of this.geometryCache.values()) geometry.dispose?.();
    for (const material of this.materialCache.values()) material.dispose?.();
    for (const texture of this.textureCache.values()) texture.dispose?.();
    this.woodTexture?.dispose?.();
    this.geometryCache.clear();
    this.materialCache.clear();
    this.textureCache.clear();
    this.renderer?.dispose?.();
  }
};

        event.preventDefault();
        if (event.shiftKey) this.redo();
        else this.undo();

      if (!editing && (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "y") {
        event.preventDefault();

      const upward = planShelfOpening(this.project, selection.region, "up");

      if (upward.boundary < this.project.grid.rows) {
        actions.push({ id: "remove-shelf-up", label: "Quitar estante superior", disabled: !upward.available });
      }
      if (downward.boundary > 0) {
        actions.push({ id: "remove-shelf-down", label: "Quitar estante inferior", disabled: !downward.available });
      }
    } else if (selection.kind === "module") {
      const module = this.project.modules.find((item) => item.id === selection.moduleId);

            { id: "back", label: "Fondo" },
            { id: "rail", label: "Barral" },
            { id: "open", label: "Abierto" }
          ];
        } else {
          actions = [
            { id: "door", label: "Puerta" },
            { id: "drawer", label: "Cajones", active: module.type === "drawer" },
            { id: "back", label: "Fondo", active: module.type === "back" },

      <div class="config-group"><div class="field"><label>Columnas</label><div class="quick-row"><button class="btn icon" data-axis="col" data-delta="-1" title="Quitar columna">\u2212</button><span class="grid-count" id="colCount">${this.project.grid.columns}</span><button class="btn icon" data-axis="col" data-delta="1" title="Agregar columna">+</button></div></div><div class="field"><label>Filas</label><div class="quick-row"><button class="btn icon" data-axis="row" data-delta="-1" title="Quitar fila">\u2212</button><span class="grid-count" id="rowCount">${this.project.grid.rows}</span><button class="btn icon" data-axis="row" data-delta="1" title="Agregar fila">+</button></div></div></div>
      <div class="config-group"><div><div class="group-label">Material</div><div class="material-options"><button class="chip ${this.project.material === "guatambu" ? "active" : ""}" data-material="guatambu">Guatamb\xFA</button><button class="chip ${this.project.material === "melamina" ? "active" : ""}" data-material="melamina">Melamina</button></div></div></div>
      ${standard ? "" : `<div class="config-group"><label class="chip"><input id="legsInput" type="checkbox" ${this.project.legs ? "checked" : ""}> Patas 6,6 cm</label></div>`}`;
    const bindChange = (id, fn) => {
      const element = container.querySelector(`#${id}`);
      if (element) element.onchange = () => fn(Number(element.value));
    };
    bindChange("widthSelect", (value) => this.requestRebuild("Cambiar ancho est\xE1ndar", { dimensions: { width: value * 10 }, columns: STANDARD_WIDTHS_CM.indexOf(value) + 1 }));
    bindChange("heightSelect", (value) => this.requestRebuild("Cambiar alto est\xE1ndar", { dimensions: { height: value * 10 }, rows: STANDARD_HEIGHTS_CM.indexOf(value) + 1 }));
    bindChange("depthSelect", (value) => this.requestRebuild("Cambiar profundidad", { dimensions: { depth: value * 10 } }));
    bindChange("widthInput", (value) => this.requestRebuild("Cambiar ancho", { dimensions: { width: Math.max(110, value * 10) } }));
    bindChange("heightInput", (value) => this.requestRebuild("Cambiar alto", { dimensions: { height: Math.max(100, value * 10) } }));
    bindChange("depthInput", (value) => this.requestRebuild("Cambiar profundidad", { dimensions: { depth: Math.max(110, value * 10) } }));
    const maxColumns = standard ? STANDARD_WIDTHS_CM.length : 10;
    const maxRows = standard ? STANDARD_HEIGHTS_CM.length : 10;
    container.querySelectorAll("[data-axis]").forEach((button) => {
      button.onclick = () => {
        const axis = button.dataset.axis;
        const delta = Number(button.dataset.delta);
        const columns = axis === "col" ? Math.min(maxColumns, Math.max(1, this.project.grid.columns + delta)) : this.project.grid.columns;
        const rows = axis === "row" ? Math.min(maxRows, Math.max(1, this.project.grid.rows + delta)) : this.project.grid.rows;
        if (columns === this.project.grid.columns && rows === this.project.grid.rows) return;
        const request = { columns, rows };
        this.requestRebuild(axis === "col" ? "Cambiar columnas" : "Cambiar filas", request);
      };
    });
    container.querySelectorAll("[data-material]").forEach((button) => {
      button.onclick = () => this.commit("Cambiar material", (project) => {
        project.material = button.dataset.material;
      });
    });
    const legs = container.querySelector("#legsInput");
    if (legs) legs.onchange = () => this.commit("Cambiar patas", (project) => {
      project.legs = legs.checked;
    });
  }
  renderContextBar() {
    const container = this.root.querySelector("#contextbar");
    if (!container) return;
    const { label, actions } = this.contextMenuForSelection();
    container.innerHTML = `<span class="context-label">${label}</span>${actions.map((action) => `<button class="btn ${action.active ? "active" : ""}" data-context="${action.id}" ${action.disabled ? "disabled" : ""}>${action.label}</button>`).join("")}`;
    container.querySelectorAll("[data-context]").forEach((button) => {
      button.onclick = () => this.runContextAction(button.dataset.context);
    });
  }
  runContextAction(action) {
    const selection = this.ui.selection;
    if (selection.kind === "opening") {
      if (action === "open") return;
      if (action === "remove-shelf-up" || action === "remove-shelf-down") {
        const direction = action === "remove-shelf-up" ? "up" : "down";
        const plan = planShelfOpening(this.project, selection.region, direction);
        if (!plan.available) {
          this.toast(plan.reason ?? "No se puede retirar ese estante.");
          return;
        }
        this.commit("Abrir espacio", (project) => {
          project.removedShelfSlots.push(...plan.slots);
        });
        return;
      }
      this.addModule(action, selection.region);
      return;
    }
    if (selection.kind === "module") {
      const module = this.project.modules.find((item) => item.id === selection.moduleId);
      if (!module) return;
      if (action.startsWith("leaf-")) {
        const mode = action.replace("leaf-", "");
        this.commit("Cambiar hojas de puerta", (project) => {
          setDoorStackLeafMode(project, module.id, mode);
        });
      } else if (action === "open") {
        this.commit("Quitar m\xF3dulo", (project) => {
          project.modules = project.modules.filter((item) => item.id !== module.id);
        });
      } else {
        this.commit("Reemplazar m\xF3dulo", (project) => {
          const index = project.modules.findIndex((item) => item.id === module.id);
          project.modules[index] = createModule(project, action, module.region);
        });
      }
      return;
    }
    if (selection.kind === "divider") {
      if (action === "remove-divider") this.removeDivider(selection.boundary);
      else if (action === "restore-divider") this.restoreDivider(selection.boundary);
      return;
    }
    if (selection.kind === "shelf") {
      if (action === "remove-shelf") this.commit("Quitar estante", (project) => {
        if (!isShelfRemoved(project, selection.column, selection.boundary)) {
          project.removedShelfSlots.push({ column: selection.column, boundary: selection.boundary });
        }
      });
      else if (action === "restore-shelf") this.commit("Restaurar estante", (project) => {
        project.removedShelfSlots = project.removedShelfSlots.filter((slot) => slot.column !== selection.column || slot.boundary !== selection.boundary);
      });
    }
  }
  addModule(type, region) {
    if (!regionIsFree(this.project, region)) return;
    if ((type === "door" || type === "drawer") && !this.frontCanUse(region)) {
      this.toast("Restaur\xE1 primero los estantes y listones que delimitan ese frente.");
      return;
    }
    this.commit(`Agregar ${type}`, (project) => {
      project.modules.push(createModule(project, type, region));
    });
  }
  frontCanUse(region) {
    for (let column = region.c0; column < region.c1; column += 1) {
      if (isShelfRemoved(this.project, column, region.r0) || isShelfRemoved(this.project, column, region.r1)) return false;
    }
    if (region.c0 > 0 && isDividerRemoved(this.project, region.c0)) return false;
    if (region.c1 < this.project.grid.columns && isDividerRemoved(this.project, region.c1)) return false;
    return true;
  }
  removeDivider(boundary) {
    const result = removeDividerAndNormalize(this.project, boundary);
    if (result.conflicts.length) {
      this.toast(result.conflicts[0]);
      return;
    }
    this.applyProject("Quitar list\xF3n", result.project);
    const notes = [];
    if (result.merged) notes.push(`${result.merged} m\xF3dulo(s) unido(s)`);
    if (result.expanded) notes.push(`${result.expanded} m\xF3dulo(s) adaptado(s)`);
    if (notes.length) this.toast(notes.join(" \xB7 "));
  }
  restoreDivider(boundary) {
    const result = restoreDividerAndNormalize(this.project, boundary);
    this.applyProject("Restaurar list\xF3n", result.project);
    if (result.split) this.toast(`${result.split} m\xF3dulo(s) dividido(s) por el nuevo list\xF3n.`);
  }
  renderViews() {
    const view2d = this.root.querySelector("#view2d");
    const view3d = this.root.querySelector("#view3d");
    const controls = this.root.querySelector("#viewControls");
    const is3d = this.ui.viewMode === "3d";
    view2d.classList.toggle("hidden-view", is3d);
    view3d.classList.toggle("hidden-view", !is3d);
    controls.classList.toggle("hidden", !is3d);
    render2D(view2d, this.project, this.ui.selection, (selection) => {
      this.ui.selection = selection;
      this.renderEditor();
    });
    if (is3d) void this.ensure3d();
  }
  async ensure3d() {
    const container = this.root.querySelector("#view3d");
    if (!this.viewer) this.viewer = new FurnitureViewer3D(container);
    try {
      await this.viewer.initialize();
      this.viewer.setProject(this.project);
      const frontsButton = this.root.querySelector("#frontsBtn");
      const centerButton = this.root.querySelector("#centerBtn");
      centerButton.onclick = () => this.viewer?.resetCamera();
      frontsButton.disabled = !this.viewer.hasFronts();
      frontsButton.onclick = () => {
        frontsButton.textContent = this.viewer?.toggleFronts() ? "Cerrar puertas" : "Abrir puertas";
      };
      if (!this.ui.hasSeen3dHelp) {
        this.ui.hasSeen3dHelp = true;
        this.toast("Arrastr\xE1 para rotar y us\xE1 la rueda para acercar.");
      }
    } catch (error) {
      container.innerHTML = `<div class="empty-help">No se pudo cargar el visor 3D.<br>La vista 2D sigue disponible.</div>`;
      console.error(error);
    }
  }
  renderCommercialSummary() {
    const container = this.root.querySelector("#commercialSummary");
    if (!container) return;
    const quote = calculateQuote(this.project);
    container.innerHTML = `<div><small>Precio estimado</small><strong>${formatArs(quote.total)}</strong><span>Valor orientativo sujeto a revisi\xF3n final.</span></div><div class="commercial-actions"><button class="btn" id="summarySaveBtn">Guardar dise\xF1o</button><button class="btn subtle" id="copySummaryBtn">Copiar resumen</button></div>`;
    container.querySelector("#summarySaveBtn").onclick = () => this.save();
    container.querySelector("#copySummaryBtn").onclick = async () => {
      const text = `${this.project.name}
${this.project.dimensions.width / 10} \xD7 ${this.project.dimensions.height / 10} \xD7 ${this.project.dimensions.depth / 10} cm
Tarjeta: ${formatArs(quote.totalBeforeDiscount)}
Efectivo o transferencia (25% OFF): ${formatArs(quote.totalBeforeDiscount * 0.75)}`;
      try {
        await navigator.clipboard.writeText(text);
        this.toast("Resumen copiado.");
      } catch {
        this.toast("No se pudo copiar el resumen.");
      }
    };
  }
  renderInternalPanel() {
    const panel = this.root.querySelector("#internalPanel");
    if (!panel) return;
    const internal = this.session.mode === "internal";
    panel.classList.toggle("hidden", !internal);
    if (!internal) return;
    const quote = calculateQuote(this.project);
    const materials = calculateMaterials(this.project);
    const issues = validateProject(this.project);
    const parts = buildFurnitureParts(this.project);
    panel.innerHTML = `<div class="internal-grid">
      <article class="internal-card"><h3>Estructura t\xE9cnica</h3><div class="field"><label>Columnas</label><input id="internalColumns" type="number" min="1" max="10" value="${this.project.grid.columns}"></div><div class="field"><label>Filas</label><input id="internalRows" type="number" min="1" max="10" value="${this.project.grid.rows}"></div><div class="field"><label>Descuento %</label><input id="internalDiscount" type="number" min="0" max="100" step=".5" value="${this.project.quote.discount}"></div></article>
      <article class="internal-card"><h3>Cotizaci\xF3n</h3><div class="internal-list">${quote.lines.map((line) => `<div class="internal-row"><span>${line.label}</span><b>${formatArs(line.value)}</b></div>`).join("")}<div class="internal-row"><span>Total</span><b>${formatArs(quote.total)}</b></div></div></article>
      <article class="internal-card"><h3>Materiales y peso</h3><div class="internal-list">${materials.rows.map((row) => `<div class="internal-row"><span>${row.label}<br><small>${formatNumber(row.surfaceM2)} m\xB2 \xB7 ${formatNumber(row.linearM)} ml</small></span><b>${formatNumber(row.weightKg)} kg</b></div>`).join("")}<div class="internal-row"><span>Total</span><b>${formatNumber(materials.totalWeightKg)} kg</b></div></div></article>
      <article class="internal-card"><h3>Validaci\xF3n</h3>${issues.length ? issues.map((issue) => `<p>${issue.level === "error" ? "\u25CF" : "\u25CB"} ${escapeHtml(issue.message)}</p>`).join("") : "<p>Sin conflictos t\xE9cnicos detectados.</p>"}<p>${parts.length} piezas derivadas.</p></article>
    </div><div class="internal-actions"><button class="btn" id="exportProjectBtn">Exportar proyecto JSON</button><button class="btn" id="exportManifestBtn">Exportar manifest</button><button class="btn" id="importProjectBtn">Importar JSON</button><input id="importProjectInput" type="file" accept="application/json" hidden></div>`;
    const columns = panel.querySelector("#internalColumns");
    const rows = panel.querySelector("#internalRows");
    const discount = panel.querySelector("#internalDiscount");
    columns.onchange = () => this.requestRebuild("Cambiar columnas", { columns: Number(columns.value) });
    rows.onchange = () => this.requestRebuild("Cambiar filas", { rows: Number(rows.value) });
    discount.onchange = () => this.commit("Cambiar descuento", (project) => {
      project.quote.discount = Math.max(0, Math.min(100, Number(discount.value)));
    });
    panel.querySelector("#exportProjectBtn").onclick = () => exportJson("parana-project-v2.json", this.project);
    panel.querySelector("#exportManifestBtn").onclick = () => exportJson("parana-manufacturing-v2.json", this.buildManifest());
    const importButton = panel.querySelector("#importProjectBtn");
    const importInput = panel.querySelector("#importProjectInput");
    importButton.onclick = () => importInput.click();
    importInput.onchange = async () => {
      const file = importInput.files?.[0];
      if (!file) return;
      try {
        const migrated = await importProjectFile(file);
        this.applyProject("Importar proyecto", migrated.project);
        if (migrated.warnings.length) this.toast(migrated.warnings.join(" "));
      } catch {
        this.toast("No se pudo importar el archivo.");
      }
    };
  }
  buildManifest() {
    const quote = calculateQuote(this.project);
    const materials = calculateMaterials(this.project);
    return {
      format: "parana-manufacturing-v2",
      generatedAt: (/* @__PURE__ */ new Date()).toISOString(),
      unit: "mm",
      currency: "ARS",
      project: clone(this.project),
      parts: buildFurnitureParts(this.project),
      quote,
      materials,
      pricingCalibration: pricingCalibration(),
      shipping: { status: "not-configured" },
      installation: { status: "not-configured" }
    };
  }
  save() {
    try {
      saveProject(this.project);
      this.savedFingerprint = fingerprint(this.project);
      this.loadedDraft = clone(this.project);
      this.toast("Proyecto guardado en este navegador.");
    } catch {
      this.toast("El navegador no permiti\xF3 guardar el proyecto.");
    }
  }
  togglePermission() {
    if (this.session.mode === "internal") {
      this.session.logout();
      this.renderEditor();
      return;
    }
    const password = window.prompt("Clave de acceso interno");
    if (password == null) return;
    if (!this.session.login(password)) {
      this.toast("Clave incorrecta.");
      return;
    }
    this.renderEditor();
  }
  // La reconstrucción ahora se aplica sola (ver requestRebuild), así que ya no
  // se muestra ningún diálogo de decisión. Esto sólo mantiene limpio el modal.
  renderConflictDialog() {
    const root2 = this.root.querySelector("#modalRoot");
    if (root2) root2.innerHTML = "";
  }
  toast(message) {
    const element = this.root.querySelector("#toast");
    if (!element) return;
    element.textContent = message;
    element.classList.add("show");
    window.clearTimeout(this.toastTimer);
    this.toastTimer = window.setTimeout(() => element.classList.remove("show"), 2600);
  }
};

// src/main.ts
var root = document.querySelector("#app");
if (!root) throw new Error("No se encontr\xF3 el contenedor principal.");
new AppController(root).start();
</script>
